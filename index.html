<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Тактика 5+1</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #18181b;
      --card-bg: #27272a;
      --text-color: #f4f4f5;
      --accent-color: #22c55e;
      --pitch-green: #15803d;
      --pitch-lines: rgba(255, 255, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: none; /* Запрет скролла страницы при перетаскивании */
    }

    .header {
      margin-bottom: 12px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header p {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-top: 2px;
    }

    .pitch-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 2 / 3;
      background-color: var(--pitch-green);
      border-radius: 16px;
      border: 3px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .pitch-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Элемент фишки игрока */
    .player-chip {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      z-index: 2;
      touch-action: none;
    }

    .player-chip:active {
      cursor: grabbing;
      z-index: 10;
    }

    .chip-avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #3f3f46;
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
    }

    .gk-chip .chip-avatar-wrapper {
      border-color: #f59e0b; /* Оранжевый ободок для вратаря */
    }

    .chip-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chip-number {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--accent-color);
      color: #000;
      font-weight: 800;
      font-size: 0.65rem;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #fff;
    }

    .chip-name {
      margin-top: 4px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      max-width: 75px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      pointer-events: none;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Состав 5+1</h1>
    <p>Перетаскивайте фишки или нажмите для изменения данных</p>
  </div>

  <div class="pitch-container" id="pitch">
    <svg class="pitch-lines" viewBox="0 0 100 150" preserveAspectRatio="none">
      <rect x="0" y="0" width="100" height="150" fill="none" stroke="var(--pitch-lines)" stroke-width="1.5" />
      <line x1="0" y1="75" x2="100" y2="75" stroke="var(--pitch-lines)" stroke-width="1.5" />
      <circle cx="50" cy="75" r="15" fill="none" stroke="var(--pitch-lines)" stroke-width="1.5" />
      <circle cx="50" cy="75" r="1" fill="var(--pitch-lines)" />
      
      <rect x="20" y="0" width="60" height="22" fill="none" stroke="var(--pitch-lines)" stroke-width="1.5" />
      <rect x="35" y="0" width="30" height="8" fill="none" stroke="var(--pitch-lines)" stroke-width="1.5" />
      
      <rect x="20" y="128" width="60" height="22" fill="none" stroke="var(--pitch-lines)" stroke-width="1.5" />
      <rect x="35" y="142" width="30" height="8" fill="none" stroke="var(--pitch-lines)" stroke-width="1.5" />
    </svg>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Редактировать игрока</h2>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <form id="playerForm">
        <div class="form-group">
          <label>Имя</label>
          <input type="text" id="inputFirstName" placeholder="Иван" required />
        </div>
        <div class="form-group">
          <label>Фамилия</label>
          <input type="text" id="inputLastName" placeholder="Иванов" required />
        </div>
        <div class="form-group">
          <label>Игровой номер</label>
          <input type="number" id="inputNumber" min="1" max="99" placeholder="10" required />
        </div>
        <div class="form-group">
          <label>Ссылка на фото</label>
          <input type="url" id="inputPhoto" placeholder="https://example.com/photo.jpg" />
        </div>
        <button type="submit" class="save-btn">Сохранить</button>
      </form>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Ровно 6 игроков (1 вратарь + 5 полевых)
    let players = [
      { id: 1, isGk: true,  x: 50, y: 88, firstName: 'Игорь', lastName: 'Акинфеев', number: 35, photo: '' },
      { id: 2, isGk: false, x: 28, y: 68, firstName: 'Марио', lastName: 'Фернандес', number: 2, photo: '' },
      { id: 3, isGk: false, x: 72, y: 68, firstName: 'Георгий', lastName: 'Джикия', number: 14, photo: '' },
      { id: 4, isGk: false, x: 50, y: 48, firstName: 'Александр', lastName: 'Головин', number: 17, photo: '' },
      { id: 5, isGk: false, x: 28, y: 24, firstName: 'Квинси', lastName: 'Промес', number: 10, photo: '' },
      { id: 6, isGk: false, x: 72, y: 24, firstName: 'Артем', lastName: 'Дзюба', number: 22, photo: '' }
    ];

    let selectedPlayerId = null;
    const pitch = document.getElementById('pitch');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeModalBtn = document.getElementById('closeModal');
    const playerForm = document.getElementById('playerForm');

    function renderPlayers() {
      document.querySelectorAll('.player-chip').forEach(el => el.remove());

      players.forEach(p => {
        const chip = document.createElement('div');
        chip.className = `player-chip ${p.isGk ? 'gk-chip' : ''}`;
        chip.style.left = `${p.x}%`;
        chip.style.top = `${p.y}%`;
        chip.dataset.id = p.id;

        const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.firstName + ' ' + p.lastName)}&background=3f3f46&color=ffffff`;

        chip.innerHTML = `
          <div class="chip-avatar-wrapper">
            <img class="chip-avatar" src="${p.photo || defaultAvatar}" alt="photo" onerror="this.src='${defaultAvatar}'" />
            <div class="chip-number">${p.number}</div>
          </div>
          <div class="chip-name">${p.lastName || p.firstName}</div>
        `;

        makeDraggable(chip, p);
        pitch.appendChild(chip);
      });
    }

    // Логика Drag-and-Drop и клика
    function makeDraggable(element, player) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let hasMoved = false;

      element.addEventListener('pointerdown', (e) => {
        isDragging = true;
        hasMoved = false;
        startX = e.clientX;
        startY = e.clientY;
        element.setPointerCapture(e.pointerId);
      });

      element.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        // Если сдвинулось больше чем на 4px, фиксируем перетаскивание
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
          hasMoved = true;
        }

        if (hasMoved) {
          const rect = pitch.getBoundingClientRect();
          let newXPct = ((e.clientX - rect.left) / rect.width) * 100;
          let newYPct = ((e.clientY - rect.top) / rect.height) * 100;

          // Ограничиваем в пределах поля (от 5% до 95%)
          newXPct = Math.max(5, Math.min(95, newXPct));
          newYPct = Math.max(5, Math.min(95, newYPct));

          player.x = newXPct;
          player.y = newYPct;

          element.style.left = `${newXPct}%`;
          element.style.top = `${newYPct}%`;
        }
      });

      element.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        element.releasePointerCapture(e.pointerId);

        // Если сдвига не было — считаем это кликом и открываем модалку
        if (!hasMoved) {
          openEditModal(player.id);
        }
      });

      element.addEventListener('pointercancel', () => {
        isDragging = false;
      });
    }

    function openEditModal(id) {
      selectedPlayerId = id;
      const player = players.find(p => p.id === id);
      if (!player) return;

      document.getElementById('modalTitle').textContent = player.isGk ? 'Редактировать вратаря' : 'Редактировать игрока';
      document.getElementById('inputFirstName').value = player.firstName;
      document.getElementById('inputLastName').value = player.lastName;
      document.getElementById('inputNumber').value = player.number;
      document.getElementById('inputPhoto').value = player.photo;

      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      selectedPlayerId = null;
    }

    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    playerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!selectedPlayerId) return;

      const playerIndex = players.findIndex(p => p.id === selectedPlayerId);
      if (playerIndex !== -1) {
        players[playerIndex].firstName = document.getElementById('inputFirstName').value.trim();
        players[playerIndex].lastName = document.getElementById('inputLastName').value.trim();
        players[playerIndex].number = parseInt(document.getElementById('inputNumber').value, 10);
        players[playerIndex].photo = document.getElementById('inputPhoto').value.trim();

        renderPlayers();
        closeModal();
      }
    });

    renderPlayers();
  </script>
</body>
</html>
